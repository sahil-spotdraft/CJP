services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonshot
      POSTGRES_PASSWORD: moonshot
      POSTGRES_DB: moonshot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonshot -d moonshot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production-moonshot-2026}
      DATABASE_URL: postgresql://moonshot:moonshot@db:5432/moonshot?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@moonshot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_REFRESH_TOKEN: ${SLACK_REFRESH_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.7}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_AGENT_ENABLED: ${CURSOR_AGENT_ENABLED:-true}
      CURSOR_AGENT_MODEL: ${CURSOR_AGENT_MODEL:-composer-2.5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
